</style></head><body><a class="skip" href="#main">Перейти к содержимому</a><div class="app"><aside class="sidebar"><a class="brand" href="#overview"><span class="brand-symbol">↗</span>АТЛАС</a><div class="brand-sub">Место для ваших планов</div><nav class="nav" aria-label="Разделы приложения"></nav><div class="side-bottom"><div class="side-card"><strong>Меньше суеты.<br>Больше впечатлений.</strong><p>Соберите всё важное в одном плане — и оставьте место для спонтанности.</p><button class="btn small" data-action="new-trip">Новая поездка <span>＋</span></button></div><div class="local-label">Планы на этом устройстве</div></div></aside><div class="workspace"><header class="topbar"><span class="crumb">Личное пространство / <span id="crumb-page">Обзор</span></span><a class="mobile-brand" href="#overview" aria-label="АТЛАС, обзор"><span>↗</span>АТЛАС</a><div class="top-right"><select class="trip-select" id="trip-select" aria-label="Активная поездка"></select><span class="profile" aria-hidden="true">А</span></div></header><div id="storage-warning" class="storage-warning" role="status" hidden></div><main id="main" class="content" tabindex="-1"></main></div></div><dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title"></h2><button class="icon-btn" data-action="close" aria-label="Закрыть">×</button></div><form id="modal-form"></form></dialog><input id="import-file" type="file" accept="application/json,.json" hidden><div class="toast" id="toast" role="status" hidden></div><script>const uid=()=>globalThis.crypto.randomUUID();
const categories=['Транспорт','Проживание','Еда','Впечатления','Покупки','Другое'];
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₸';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
function totals(trip){const byCategory=Object.fromEntries(categories.map(c=>[c,0]));let paid=0;for(const e of trip.expenses){byCategory[e.category]+=e.amount;if(e.paid)paid+=e.amount;}const planned=Object.values(byCategory).reduce((a,b)=>a+b,0);return {planned,paid,remaining:trip.budget-planned,byCategory};}
function conflicts(stops){const sorted=[...stops].sort((a,b)=>minutes(a.time)-minutes(b.time));const ids=new Set();for(let i=0;i<sorted.length;i++)for(let j=i+1;j<sorted.length;j++)if(minutes(sorted[j].time)<minutes(sorted[i].time)+sorted[i].duration){ids.add(sorted[i].id);ids.add(sorted[j].id);}return ids;}
function tripDate(trip,day){const d=new Date(trip.start+'T12:00:00');d.setDate(d.getDate()+day-1);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function validState(s){
 if(!s||s.version!==1||!Array.isArray(s.trips)||s.trips.length<1||s.trips.length>30)throw Error('Нужен файл поездок АТЛАС версии 1.');
 const ids=new Set();const id=x=>{if(typeof x!=='string'||! /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(x)||ids.has(x))throw Error('В файле повторяются или некорректны идентификаторы.');ids.add(x);};
 const str=(x,max)=>{if(typeof x!=='string'||x.length>max)throw Error('В файле некорректный текст.');};
 const num=(x,min,max)=>{if(typeof x!=='number'||!Number.isFinite(x)||x<min||x>max)throw Error('В файле некорректные числа.');};
 for(const t of s.trips){id(t.id);str(t.name,80);str(t.city,60);str(t.note,300);if(!/^\d{4}-\d{2}-\d{2}$/.test(t.start)||!Number.isFinite(Date.parse(t.start+'T12:00:00'))||new Date(t.start+'T12:00:00').toISOString().slice(0,10)!==t.start)throw Error('Неверная дата поездки.');num(t.days,1,14);num(t.travelers,1,12);num(t.budget,0,1e9);if(!Number.isInteger(t.days)||!Number.isInteger(t.travelers))throw Error('Количество дней и людей должно быть целым.');if(!Array.isArray(t.stops)||t.stops.length>200||!Array.isArray(t.expenses)||t.expenses.length>500||!Array.isArray(t.checklist)||t.checklist.length>300)throw Error('Слишком много записей.');
 for(const a of t.stops){id(a.id);str(a.name,80);str(a.type,40);str(a.note,300);num(a.day,1,t.days);num(a.duration,5,720);num(a.cost,0,1e8);if(!Number.isInteger(a.day)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(a.time)||minutes(a.time)+a.duration>1440)throw Error('Некорректное время остановки.');}
 for(const e of t.expenses){id(e.id);str(e.name,80);if(!categories.includes(e.category)||typeof e.paid!=='boolean')throw Error('Некорректный расход.');num(e.amount,0,1e8);}
 for(const c of t.checklist){id(c.id);str(c.name,100);str(c.group,30);if(typeof c.done!=='boolean')throw Error('Некорректный пункт списка.');}}
 if(!s.trips.some(t=>t.id===s.active))s.active=s.trips[0].id;return s;
}
function template(city='Лиссабон'){

 [['Билеты туда и обратно','Транспорт',160000,true],['Четыре ночи в апартаментах','Проживание',110000,false],['Еда на всю поездку','Еда',60000,false],['Музеи и прогулки','Впечатления',26000,false]].forEach(([name,category,amount,paid])=>t.expenses.push({id:uid(),name,category,amount,paid}));
 [['Паспорт','Документы',true],['Сохранить билеты офлайн','Документы',true],['Проверить правила въезда','Документы',false],['Зарядка и пауэрбанк','В рюкзак',false],['Удобная обувь','В рюкзак',false],['Лёгкая куртка','В рюкзак',false],['Скачать офлайн-карту','До поездки',false],['Проверить бронирование','До поездки',false],['Поделиться планом с близкими','До поездки',false]].forEach(([name,group,done])=>t.checklist.push({id:uid(),name,group,done}));return t;

function mapSVG(t){const stops=t.stops.filter(s=>s.day===day);const coords=stops.map((s,i)=>[70+(i%4)*115,95+Math.floor(i/4)*68+(i%2)*48]);const vbH=Math.max(320,Math.ceil(stops.length/4)*68+155);return `<div class="map-wrap"><span class="map-label">${esc(t.city)} / схема маршрута</span><svg viewBox="0 0 500 ${vbH}" role="img" aria-label="Схема остановок выбранного дня, не географическая карта"><rect width="500" height="${vbH}" fill="#edf0e6"/><path d="M335 0 280 95 320 170 265 ${vbH}H500V0Z" fill="#bedad8"/><g fill="#dde4d6" stroke="#f7f8f2" stroke-width="7">${Array.from({length:10},(_,i)=>`<rect x="${20+(i%3)*98}" y="${35+Math.floor(i/3)*70}" width="77" height="52" rx="9"/>`).join('')}</g><path d="M0 60 500 285M0 200 480 70M50 0l70 ${vbH}M230 0l-40 ${vbH}" stroke="#fff" stroke-width="13" fill="none"/><path d="M0 60 500 285M0 200 480 70" stroke="#d5ddcd" stroke-width="1" fill="none"/>${stops.length>1?`<polyline points="${coords.map(x=>x.join(',')).join(' ')}" stroke="#1d5b51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" fill="none"/>`:''}${stops.map((s,i)=>`<g class="map-marker" tabindex="0" role="button" aria-label="${esc(s.name)}" data-select="${s.id}" transform="translate(${coords[i].join(' ')})"><circle r="${selected===s.id?20:16}" fill="${selected===s.id?'#ed8860':'#1d5b51'}" stroke="#fff" stroke-width="4"/><text y="4" fill="#fff" text-anchor="middle" font-size="12" font-family="Onest, sans-serif">${i+1}</text><title>${esc(s.name)}</title></g>`).join('')}<text x="435" y="${vbH-25}" font-size="11" fill="#577673">N ↑</text></svg></div><p class="map-note">Условная схема для выбора мест. Координаты и время в пути не рассчитываются.</p>`;}

 if(page==='route')html=heading('Каждый день — новая история','Ваш маршрут','Переставляйте места мышью или стрелками. Время можно изменить вручную.','<button class="btn primary" data-action="add-stop">＋ Место</button>')+`<div class="route-layout"><section class="panel"><div class="panel-head"><h2>День ${day}</h2><span class="tag">${tripDate(t,day)}</span></div>${routePanel()}<p class="hint" style="margin-top:15px">Оценки мест не добавляются в бюджет автоматически. Расходы на всю поездку ведутся отдельно.</p></section><div class="stack"><section class="panel"><div class="panel-head"><h2>${esc(t.city)}</h2><span class="tag">Исследуйте</span></div>${mapSVG(t)}${selected&&t.stops.some(s=>s.id===selected)?`<div class="note-card"><h3>${esc(t.stops.find(s=>s.id===selected).name)}</h3><p>${esc(t.stops.find(s=>s.id===selected).note||'Добавьте заметку, чтобы всё важное было под рукой.')}</p><button class="btn small" data-action="edit-stop" data-id="${selected}">Изменить место</button></div>`:''}</section><div class="note-card" style="margin:0"><h3>План, который можно взять с собой</h3><p>Сохраните весь маршрут, расходы и чек-лист в печатный документ. В окне печати можно выбрать PDF.</p><a class="btn small" href="#plan">Подготовить план ↗</a></div></div></div>`;
 if(page==='budget')html=heading('Впечатления без лишних тревог','Каждый тенге на своём месте','Планируйте расходы и отмечайте, что уже оплачено.','<button class="btn primary" data-action="add-expense">＋ Расход</button>')+`<div class="stats">${[['Лимит поездки',t.budget],['Запланировано',b.planned],['Уже оплачено',b.paid],['Осталось в лимите',b.remaining]].map(([l,v])=>`<div class="stat"><div class="stat-label">${l}</div><div class="stat-value" style="${v<0?'color:#a45435':''}">${money(v)}</div></div>`).join('')}</div><div class="columns"><section class="panel"><div class="panel-head"><h2>Расходы</h2><button class="text-link" data-action="edit-trip">Изменить лимит</button></div><div class="tabs"><button class="tab ${filter==='all'?'active':''}" data-filter="all">Все</button><button class="tab ${filter==='paid'?'active':''}" data-filter="paid">Оплачены</button><button class="tab ${filter==='planned'?'active':''}" data-filter="planned">В планах</button></div><table class="expense-table"><thead><tr><th>Расход</th><th>Категория</th><th>Сумма</th><th>Статус</th><th><span class="muted">Правки</span></th></tr></thead><tbody>${t.expenses.filter(e=>filter==='all'||(filter==='paid'?e.paid:!e.paid)).map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.category)}</td><td style="white-space:nowrap">${money(e.amount)}</td><td><button class="status ${e.paid?'paid':''}" data-action="toggle-paid" data-id="${e.id}" aria-label="${esc(e.name)}: ${e.paid?'оплачен':'в планах'}, переключить">${e.paid?'Оплачен':'В планах'}</button></td><td><div class="stop-actions"><button class="icon-btn" data-action="edit-expense" data-id="${e.id}" aria-label="Изменить расход">✎</button><button class="icon-btn" data-action="delete-expense" data-id="${e.id}" aria-label="Удалить расход">×</button></div></td></tr>`).join('')}</tbody></table>${!t.expenses.length?'<div class="empty">Добавьте первый расход.<br>Все суммы относятся ко всей поездке.</div>':''}<p class="hint" style="margin-top:20px">АТЛАС не выполняет оплаты. Значения в примерной поездке вымышлены, замените их своими.</p></section><section class="panel"><div class="panel-head"><h2>На что уходит бюджет</h2></div><p class="budget-total">${money(b.planned)}</p><p class="muted" style="font-size:11px;margin-bottom:28px">${money(b.planned/t.travelers)} на человека</p><div class="category-bars">${categories.map((c,i)=>`<div><div class="category-top"><span>${c}</span><span>${money(b.byCategory[c])}</span></div><div class="progress-track"><i style="background:${colors[i]};width:${b.byCategory[c]/Math.max(1,b.planned)*100}%"></i></div></div>`).join('')}</div>${b.remaining<0?'<div class="warning" style="margin-top:25px">Расходы превышают лимит. Пересмотрите планы или измените бюджет.</div>':''}</section></div>`;
 if(page==='checklist'){const done=t.checklist.filter(c=>c.done).length;const groups=[...new Set(t.checklist.map(c=>c.group))];html=heading('Не забыть самое важное','Рюкзак почти собран','Отмечайте готовое, добавляйте своё и собирайтесь без спешки.','<button class="btn primary" data-action="add-check">＋ Пункт</button>')+`<section class="panel" style="margin-bottom:22px"><div class="panel-head"><h2>Готово ${done} из ${t.checklist.length}</h2><span class="tag">${Math.round(done/Math.max(1,t.checklist.length)*100)}%</span></div><div class="progress-track"><i style="width:${done/Math.max(1,t.checklist.length)*100}%"></i></div></section><div class="tabs"><button class="tab ${filter==='all'?'active':''}" data-filter="all">Все пункты</button><button class="tab ${filter==='open'?'active':''}" data-filter="open">Ещё не готовы</button><button class="tab ${filter==='done'?'active':''}" data-filter="done">Готовы</button></div><div class="check-columns">${groups.map(g=>{const items=t.checklist.filter(c=>c.group===g&&(filter==='all'||(filter==='done'?c.done:!c.done)));return `<section class="panel"><div class="panel-head"><h2>${esc(g)}</h2><span class="tag">${items.length}</span></div>${checkRows(items)||'<p class="muted">Здесь пока пусто.</p>'}</section>`;}).join('')}</div>${!groups.length?'<div class="empty">Что взять с собой?<br>Добавьте первый пункт.</div>':''}<div class="note-card"><h3>Проверьте условия именно своей поездки</h3><p>Срок действия документов, правила въезда и требования перевозчика могут меняться. Этот список — ваш личный план, а не проверка готовности документов.</p></div>`;}
 if(page==='trips')html=heading('Все планы в одном месте','Куда дальше?','Создайте свою поездку или исследуйте готовый пример.','<button class="btn primary" data-action="new-trip">＋ Поездка</button>')+`<div class="travel-grid">${state.trips.map(x=>`<article class="travel-card ${x.id===state.active?'active':''}"><div class="travel-cover">${artwork(x.city)}<span class="pill">${esc(x.city)}</span></div><div class="travel-info"><small>${tripDate(x,1)} · ${x.days} дня · ${x.travelers} чел.</small><h3>${esc(x.name)}</h3><div class="travel-meta">${x.stops.length} места · ${x.checklist.filter(c=>c.done).length}/${x.checklist.length} пунктов готовы</div><div class="travel-bottom"><b>${money(x.budget)}</b><button class="btn small" data-action="open-trip" data-id="${x.id}">${x.id===state.active?'Открыта ✓':'Открыть ↗'}</button></div></div></article>`).join('')}<button class="new-card" data-action="new-trip"><span class="plus">＋</span><strong>Новая история</strong><span class="muted" style="font-size:12px">Город, даты и немного любопытства.<br>Начните с чистого листа.</span></button></div><div class="settings-grid" style="margin-top:24px"><section class="panel"><div class="panel-head"><h2>Сохранить планы</h2></div><p class="muted" style="font-size:12px">Планы хранятся только в этом браузере. Резервная копия позволяет перенести их на другое устройство.</p><div class="action-row"><button class="btn small" data-action="export">Скачать JSON ↓</button><button class="btn small" data-action="import">Импортировать ↑</button><a class="btn small" href="#plan">Печатный план ↗</a></div></section><section class="panel"><div class="panel-head"><h2>Управление поездкой</h2></div><p class="muted" style="font-size:12px">Сейчас открыта: ${esc(t.name)}. Измените даты или создайте копию для другого путешествия.</p><div class="action-row"><button class="btn small" data-action="edit-trip">Настроить</button><button class="btn small" data-action="duplicate">Создать копию</button><button class="btn small danger" data-action="delete-trip" ${state.trips.length===1?'disabled':''}>Удалить</button></div></section></div><div class="note-card"><h3>Попробуйте другой маршрут</h3><p>Готовые примеры содержат вымышленные расписания и расходы. Можно свободно менять любые записи.</p><div class="action-row"><button class="btn small" data-action="example" data-city="Стамбул">Стамбул →</button><button class="btn small" data-action="example" data-city="Алматы">Алматы →</button><button class="btn small" data-action="example" data-city="Лиссабон">Лиссабон →</button></div></div>`;
 if(page==='plan')html=heading('План целиком',esc(t.name),`${esc(t.city)} · ${tripDate(t,1)} — ${tripDate(t,t.days)} · ${t.travelers} чел.`,'<button class="btn primary" data-action="print">Печать / PDF ↗</button>')+`<p class="detail-note">${esc(t.note)}</p>${Array.from({length:t.days},(_,i)=>`<section class="panel" style="margin-bottom:18px"><h2>День ${i+1} · ${tripDate(t,i+1)}</h2>${stopsHTML(t.stops.filter(s=>s.day===i+1),false)}</section>`).join('')}<section class="panel" style="margin-bottom:18px"><h2>Бюджет</h2><p>Лимит ${money(t.budget)} · Расходы ${money(b.planned)} · Оплачено ${money(b.paid)}</p><table class="expense-table"><tbody>${t.expenses.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${e.paid?'Оплачено':'В планах'}</td></tr>`).join('')}</tbody></table></section><section class="panel"><h2>Чек-лист</h2>${t.checklist.map(c=>`<p style="font-size:12px">${c.done?'☑':'☐'} ${esc(c.name)} · ${esc(c.group)}</p>`).join('')}</section><div class="action-row" style="margin-top:20px"><a class="btn" href="#overview">← Вернуться</a></div>`;
 $('#main').innerHTML=html+footer();$('#storage-warning').hidden=storageOK;document.title=(labels[page]||'План')+' · АТЛАС';
}
const input=(label,name,value,type='text',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`;
const select=(label,name,value,options)=>`<label class="field">${label}<select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
function openModal(kind,id){const t=trip();const stop=t.stops.find(s=>s.id===id),expense=t.expenses.find(e=>e.id===id);let title,fields;
 if(kind==='stop'){title=stop?'Изменить место':'Новое место';const a=stop||{name:'',day,time:'10:00',duration:60,type:'Прогулка',cost:0,note:''};fields=input('Название места','name',a.name,'text','maxlength="80"')+select('День','day',a.day,Array.from({length:t.days},(_,i)=>[i+1,'День '+(i+1)]))+input('Начало','time',a.time,'time')+input('Продолжительность, мин','duration',a.duration,'number','min="5" max="720" step="5"')+select('Тип места','type',a.type,['Прогулка','Кофе','Еда','Впечатления','Отдых','Переезд'].map(x=>[x,x]))+input('Оценка расходов, ₸','cost',a.cost,'number','min="0" max="100000000" step="1"')+`<label class="field full">Заметка<textarea name="note" maxlength="300">${esc(a.note)}</textarea></label><p class="label-info field full">Оценка места не добавляется в бюджет автоматически.</p>`;}
 if(kind==='expense'){title=expense?'Изменить расход':'Новый расход';const e=expense||{name:'',category:'Другое',amount:0,paid:false};fields=input('Название расхода','name',e.name,'text','maxlength="80"')+select('Категория','category',e.category,categories.map(c=>[c,c]))+input('Сумма за всю поездку, ₸','amount',e.amount,'number','min="0" max="100000000" step="1"')+`<label class="field" style="display:flex;align-items:center;padding-top:20px;color:var(--ink)"><input name="paid" type="checkbox" ${e.paid?'checked':''} style="width:17px"> Уже оплачено</label>`;}
 if(kind==='check'){title='Новый пункт';fields=input('Что не забыть','name','','text','maxlength="100"')+select('Группа','group','До поездки',['Документы','В рюкзак','До поездки'].map(x=>[x,x]));}
 if(kind==='trip'||kind==='new'){title=kind==='new'?'Новая поездка':'Настройки поездки';const x=kind==='new'?{name:'',city:'',start:new Date().toISOString().slice(0,10),days:3,travelers:1,budget:100000,note:''}:t;fields=input('Название поездки','name',x.name,'text','maxlength="80"')+input('Город или направление','city',x.city,'text','maxlength="60"')+input('Начало поездки','start',x.start,'date','min="2000-01-01" max="2099-12-31"')+input('Дней','days',x.days,'number','min="1" max="14" step="1"')+input('Путешественников','travelers',x.travelers,'number','min="1" max="12" step="1"')+input('Бюджет всей поездки, ₸','budget',x.budget,'number','min="0" max="1000000000" step="1"')+`<label class="field full">Настроение поездки<textarea name="note" maxlength="300">${esc(x.note)}</textarea></label>`;}
 $('#modal-title').textContent=title;$('#modal-form').innerHTML=`<div class="form-grid">${fields}</div><div class="error" id="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" data-action="close">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div>`;
 $('#modal-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);for(const k of ['day','duration','cost','amount','days','travelers','budget'])if(k in data)data[k]=Number(data[k]);for(const k of ['name','city','note'])if(k in data)data[k]=data[k].trim();if(!data.name){$('#form-error').textContent='Укажите название.';return;}if(kind==='stop'&&minutes(data.time)+data.duration>1440){$('#form-error').textContent='Посещение должно закончиться до полуночи. Измените время или продолжительность.';return;}if(kind==='trip'&&t.stops.some(s=>s.day>data.days)){ $('#form-error').textContent='В убираемых днях есть места. Сначала перенесите или удалите их в маршруте.';return;}
 const copy=structuredClone(state);const dest=copy.trips.find(x=>x.id===copy.active);if(kind==='stop'){if(stop)Object.assign(dest.stops.find(s=>s.id===id),data);else dest.stops.push({id:uid(),...data});}if(kind==='expense'){data.paid=f.has('paid');if(expense)Object.assign(dest.expenses.find(x=>x.id===id),data);else dest.expenses.push({id:uid(),...data});}if(kind==='check')dest.checklist.push({id:uid(),done:false,...data});if(kind==='trip')Object.assign(dest,data);if(kind==='new'){const x={id:uid(),...data,stops:[],expenses:[],checklist:[]};copy.trips.push(x);copy.active=x.id;}
 try{validState(copy);}catch(error){$('#form-error').textContent=error.message;return;}undoState=structuredClone(state);state=copy;if(kind==='stop')day=data.day;if(kind==='new')day=1;save();$('#modal').close();render();toast('Сохранено');};$('#modal').showModal();}
function reorder(id,target){const t=trip(),list=t.stops.filter(s=>s.day===day);const from=list.findIndex(s=>s.id===id);if(from<0||target<0||target>=list.length||from===target)return;change(()=>{const times=list.map(s=>s.time).sort();const [m]=list.splice(from,1);list.splice(target,0,m);list.forEach((s,i)=>s.time=times[i]);let i=0;t.stops=t.stops.map(s=>s.day===day?list[i++]:s);},'Порядок изменён. Проверьте время посещений.');}
document.addEventListener('click',e=>{
 const action=e.target.closest('[data-action]'),dayBtn=e.target.closest('[data-day]'),f=e.target.closest('[data-filter]'),sel=e.target.closest('[data-select]');if(dayBtn){day=Number(dayBtn.dataset.day);selected='';render();return;}if(f){filter=f.dataset.filter;render();return;}if(sel){selected=sel.dataset.select;render();return;}if(!action)return;const a=action.dataset.action,id=action.dataset.id,t=trip();
 if(a==='close')$('#modal').close();if(a==='new-trip')openModal('new');if(a==='edit-trip')openModal('trip');if(a==='add-stop')openModal('stop');if(a==='edit-stop')openModal('stop',id);if(a==='add-expense')openModal('expense');if(a==='edit-expense')openModal('expense',id);if(a==='add-check')openModal('check');
 if(a==='delete-stop')change(()=>{t.stops=t.stops.filter(s=>s.id!==id);if(selected===id)selected='';},'Место удалено',true);if(a==='delete-expense')change(()=>t.expenses=t.expenses.filter(x=>x.id!==id),'Расход удалён',true);if(a==='delete-check')change(()=>t.checklist=t.checklist.filter(x=>x.id!==id),'Пункт удалён',true);if(a==='toggle-paid')change(()=>{const x=t.expenses.find(x=>x.id===id);x.paid=!x.paid;});
 if(a==='move-up'||a==='move-down'){const index=t.stops.filter(s=>s.day===day).findIndex(s=>s.id===id);reorder(id,index+(a==='move-up'?-1:1));}
 if(a==='open-trip'){state.active=id;day=1;selected='';save();render();toast('Поездка открыта');}
 if(a==='example'){if(state.trips.length>=30){toast('Можно сохранить до 30 поездок.');return;}change(()=>{const x=template(action.dataset.city);state.trips.push(x);state.active=x.id;day=1;selected='';},'Пример добавлен');}
 if(a==='duplicate'){if(state.trips.length>=30){toast('Можно сохранить до 30 поездок.');return;}change(()=>{const x=structuredClone(t);x.id=uid();x.name=(t.name+' — копия').slice(0,80);[...x.stops,...x.expenses,...x.checklist].forEach(r=>r.id=uid());state.trips.push(x);state.active=x.id;day=1;selected='';},'Копия создана');}
 if(a==='delete-trip'&&state.trips.length>1){change(()=>{state.trips=state.trips.filter(x=>x.id!==state.active);state.active=state.trips[0].id;day=1;selected='';},'Поездка удалена',true);}
 if(a==='undo'&&undoState){state=undoState;undoState=null;day=Math.min(day,trip().days);selected='';save();render();toast('Удаление отменено');}
 if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='atlas-trips.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Резервная копия скачана');}
 if(a==='import')$('#import-file').click();if(a==='print')window.print();
});
document.addEventListener('change',e=>{if(e.target.dataset.check){const id=e.target.dataset.check;change(()=>{trip().checklist.find(x=>x.id===id).done=e.target.checked;});}if(e.target.id==='trip-select'){state.active=e.target.value;day=1;selected='';save();render();}});
document.addEventListener('keydown',e=>{if(e.target.matches('.map-marker')&&['Enter',' '].includes(e.key)){e.preventDefault();selected=e.target.dataset.select;render();}});
let dragId=null;document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-stop]');if(!row)return;dragId=row.dataset.stop;row.classList.add('dragging');e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';});document.addEventListener('dragover',e=>{if(dragId&&e.target.closest('[data-stop]'))e.preventDefault();});document.addEventListener('drop',e=>{const row=e.target.closest('[data-stop]');if(!row||!dragId)return;e.preventDefault();const target=trip().stops.filter(s=>s.day===day).findIndex(s=>s.id===row.dataset.stop);reorder(dragId,target);dragId=null;});document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging'));});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2_000_000)throw Error('Файл больше 2 МБ.');const loaded=validState(JSON.parse(await file.text()));if(!confirm('Заменить текущие планы содержимым файла? Сначала скачайте резервную копию, если хотите сохранить оба набора.'))return;undoState=structuredClone(state);state=loaded;day=1;selected='';save();render();toast('Планы импортированы',true);}catch(error){toast(error instanceof SyntaxError?'Не удалось прочитать JSON. Выберите резервную копию АТЛАС.':error.message);}finally{e.target.value='';}});
window.addEventListener('hashchange',()=>{filter='all';selected='';render();window.scrollTo(0,0);});save();render();
</script></body></html>
